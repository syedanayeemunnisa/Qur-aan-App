name: quran_app
description: "Real-time Quran translation and verse recognition app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Camera
  camera: ^0.11.0+2
  camera_android_camerax: ^0.6.8+1
  permission_handler: ^11.3.1

  # Networking
  http: ^1.2.2
  dio: ^5.7.0

  # State management
  provider: ^6.1.2

  # Local storage
  sqflite: ^2.4.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.3

  # Image processing
  image_picker: ^1.1.2

  # Utilities
  flutter_polyline_points: ^2.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Add generated Quran database here for offline mode:
  # assets:
  #   - assets/quran.db
